<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 번호 추첨기</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K6LNM0PJLY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-K6LNM0PJLY');
</script>

<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 24px;
  }
  p.sub {
    margin: 0 0 28px;
    color: #94a3b8;
    font-size: 14px;
  }
  .balls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    min-height: 64px;
    margin-bottom: 28px;
  }
  .ball {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
    color: #fff;
    opacity: 0;
    transform: scale(0.3);
    animation: pop 0.4s ease forwards;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
  }
  @keyframes pop {
    to { opacity: 1; transform: scale(1); }
  }
  .n1  { background: #fbc400; color: #3b2a00;}
  .n2  { background: #69c8f2; }
  .n3  { background: #ff7272; }
  .n4  { background: #aaaaaa; }
  .n5  { background: #b0d840; color: #2b3400;}

  button {
    background: #6366f1;
    color: #fff;
    border: none;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: #4f46e5; }
  button:active { transform: scale(0.97); }
  button:disabled {
    background: #475569;
    cursor: not-allowed;
  }

  .history {
    margin-top: 24px;
    text-align: left;
    font-size: 13px;
    color: #cbd5e1;
    max-height: 160px;
    overflow-y: auto;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .history-item .mini-ball {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: #fff;
  }

  /* 챗봇 */
  #chatToggle {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #6366f1;
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    z-index: 1000;
    padding: 0;
  }
  #chatToggle:hover { background: #4f46e5; }

  #chatWindow {
    position: fixed;
    right: 24px;
    bottom: 92px;
    width: 320px;
    max-width: calc(100vw - 48px);
    height: 420px;
    max-height: calc(100vh - 140px);
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
  }
  #chatWindow.open { display: flex; }

  .chat-header {
    background: #6366f1;
    color: #fff;
    padding: 14px 16px;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chat-header button {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 18px;
    padding: 0;
    cursor: pointer;
    line-height: 1;
  }
  .chat-header button:hover { background: transparent; opacity: 0.8; }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
  }
  .chat-msg {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .chat-msg.bot {
    background: rgba(255,255,255,0.08);
    color: #f1f5f9;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .chat-msg.user {
    background: #6366f1;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .chat-quick {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 12px 8px;
  }
  .chat-quick button {
    background: rgba(255,255,255,0.08);
    color: #f1f5f9;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 400;
    border-radius: 999px;
  }
  .chat-quick button:hover { background: rgba(255,255,255,0.16); }

  .chat-input {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .chat-input input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 10px 12px;
    color: #f1f5f9;
    font-size: 13px;
    outline: none;
  }
  .chat-input input:focus { border-color: #6366f1; }
  .chat-input button {
    padding: 10px 16px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🎱 로또 번호 추첨기</h1>
  <p class="sub">1 ~ 45 중 중복 없는 번호 6개를 뽑아드려요</p>

  <div class="balls" id="balls"></div>

  <button id="drawBtn">번호 뽑기</button>

  <div class="history" id="history"></div>
</div>

<button id="chatToggle" title="챗봇 열기">💬</button>
<div id="chatWindow">
  <div class="chat-header">
    <span>🎱 로또 도우미</span>
    <button id="chatClose" title="닫기">✕</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-quick">
    <button data-q="번호 뽑아줘">번호 뽑아줘</button>
    <button data-q="사용법">사용법</button>
    <button data-q="당첨 확률">당첨 확률</button>
  </div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="메시지를 입력하세요..." autocomplete="off">
    <button id="chatSend">전송</button>
  </div>
</div>

<script>
  const ballsEl = document.getElementById('balls');
  const historyEl = document.getElementById('history');
  const drawBtn = document.getElementById('drawBtn');

  function colorClass(num) {
    if (num <= 10) return 'n1';
    if (num <= 20) return 'n2';
    if (num <= 30) return 'n3';
    if (num <= 40) return 'n4';
    return 'n5';
  }

  function drawNumbers() {
    const pool = Array.from({ length: 45 }, (_, i) => i + 1);
    const result = [];
    for (let i = 0; i < 6; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      result.push(pool.splice(idx, 1)[0]);
    }
    return result.sort((a, b) => a - b);
  }

  function renderBalls(numbers) {
    ballsEl.innerHTML = '';
    numbers.forEach((num, i) => {
      const ball = document.createElement('div');
      ball.className = `ball ${colorClass(num)}`;
      ball.textContent = num;
      ball.style.animationDelay = `${i * 0.15}s`;
      ballsEl.appendChild(ball);
    });
  }

  function addHistory(numbers) {
    const item = document.createElement('div');
    item.className = 'history-item';
    const time = new Date().toLocaleTimeString('ko-KR');
    item.innerHTML = `<span>${time}</span>` +
      numbers.map(n => `<span class="mini-ball ${colorClass(n)}">${n}</span>`).join('');
    historyEl.prepend(item);
  }

  async function saveDraw(numbers) {
    try {
      const res = await fetch('/api/draw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numbers }),
      });
      if (!res.ok) throw new Error(await res.text());
    } catch (err) {
      console.error('DB 저장 실패:', err);
    }
  }

  drawBtn.addEventListener('click', () => {
    drawBtn.disabled = true;
    const numbers = drawNumbers();
    renderBalls(numbers);
    addHistory(numbers);
    saveDraw(numbers);
    setTimeout(() => { drawBtn.disabled = false; }, 900);
  });

  // 첫 화면에서 자동으로 한 번 뽑아 보여주기
  renderBalls(drawNumbers());

  // ===== 챗봇 =====
  const chatToggle = document.getElementById('chatToggle');
  const chatWindow = document.getElementById('chatWindow');
  const chatClose = document.getElementById('chatClose');
  const chatBody = document.getElementById('chatBody');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');

  function addChatMsg(text, from) {
    const msg = document.createElement('div');
    msg.className = `chat-msg ${from}`;
    msg.textContent = text;
    chatBody.appendChild(msg);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function botDraw() {
    const numbers = drawNumbers();
    renderBalls(numbers);
    addHistory(numbers);
    saveDraw(numbers);
    return `번호를 뽑았어요! 🎉\n${numbers.join(', ')}`;
  }

  function getBotReply(raw) {
    const text = raw.trim();
    const lower = text.toLowerCase();

    if (/뽑|추첨|돌려|번호\s*줘/.test(text)) {
      return botDraw();
    }
    if (/사용법|어떻게\s*써|도움말|help/.test(lower)) {
      return '오른쪽 위 "번호 뽑기" 버튼이나 여기서 "번호 뽑아줘"라고 말하면 1~45 중 6개 번호를 무작위로 뽑아드려요. 이력은 카드 하단에 쌓여요.';
    }
    if (/확률/.test(text)) {
      return '로또 6/45 1등 당첨 확률은 대략 1/8,145,060이에요. 사실 순수 확률이라 어떤 번호를 골라도 확률은 동일해요!';
    }
    if (/안녕|hi|hello/.test(lower)) {
      return '안녕하세요! 저는 로또 도우미 챗봇이에요. "번호 뽑아줘"라고 말해보세요 😊';
    }
    if (/고마|감사|thanks/.test(lower)) {
      return '천만에요! 행운을 빌어요 🍀';
    }
    if (/누구|정체|뭐야/.test(text)) {
      return '저는 이 페이지에 내장된 간단한 규칙 기반 챗봇이에요. 정해진 몇 가지 질문에만 답할 수 있어요.';
    }
    return '음, 잘 이해하지 못했어요. "번호 뽑아줘", "사용법", "당첨 확률" 같은 걸 물어봐 주세요!';
  }

  function handleUserInput() {
    const value = chatInput.value.trim();
    if (!value) return;
    addChatMsg(value, 'user');
    chatInput.value = '';
    setTimeout(() => addChatMsg(getBotReply(value), 'bot'), 300);
  }

  chatToggle.addEventListener('click', () => {
    chatWindow.classList.toggle('open');
    if (chatWindow.classList.contains('open') && chatBody.children.length === 0) {
      addChatMsg('안녕하세요! 로또 도우미예요. 아래 버튼을 누르거나 메시지를 입력해보세요.', 'bot');
    }
  });
  chatClose.addEventListener('click', () => chatWindow.classList.remove('open'));
  chatSend.addEventListener('click', handleUserInput);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleUserInput();
  });
  document.querySelectorAll('.chat-quick button').forEach(btn => {
    btn.addEventListener('click', () => {
      addChatMsg(btn.dataset.q, 'user');
      setTimeout(() => addChatMsg(getBotReply(btn.dataset.q), 'bot'), 300);
    });
  });
</script>

</body>
</html>
